{% extends 'layouts/form_page.html' %}

{% block page_title %}
Agregar Cliente
{% endblock %}

{% block form_fields %}
<div class="tuki-form-group">
    <div class="col-12">
        <label for="customer_name" class="tuki-form-label">Nombre</label>
        <input 
        type="text" 
        id="customer_name" 
        name="customer_name" 
        class="form-control tuki-input" 
        value="{{ form_data.customer_name|default:'' }}"
        placeholder="Carlos Gonzales" 
        >
    </div>
    <div class="col-12">
        <label for="customer_phone" class="tuki-form-label">Telefono</label>
        <input 
        type="text" 
        id="customer_phone" 
        name="customer_phone" 
        class="form-control tuki-input" 
        value="{{ form_data.customer_phone|default:'' }}"
        placeholder="2216768479" 
        >
    </div>
    <p class="tuki-form-help">Se puede formato tipo +5492216768479</p>
    <div class="col-12">
        <label for="customer_email" class="tuki-form-label">Email</label>
        <input 
        type="email" 
        id="customer_email" 
        name="customer_email" 
        class="form-control tuki-input" 
        value="{{ form_data.customer_email|default:'' }}"
        placeholder="formato@email.com" 
        >
    </div>
</div>
    

{% endblock %}
